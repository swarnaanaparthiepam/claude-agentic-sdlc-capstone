name: Publish to Confluence

on:
  workflow_dispatch:
    inputs:
      user_story_id:
        description: "User Story ID for manual publishing (e.g. CJS-2)"
        required: true
        type: string

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  publish:
    name: Publish SDLC Artifacts to Confluence
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # --------------------------------------------------
      # 3. Determine User Story ID
      # --------------------------------------------------
      - name: Determine User Story ID
        id: story
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_STORY_ID: ${{ github.event.inputs.user_story_id }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -e

          echo "Event: $EVENT_NAME"
          echo "PR title: $PR_TITLE"
          echo "PR branch: $PR_BRANCH"

          USER_STORY_ID=""

          # Manual workflow execution
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            USER_STORY_ID="$MANUAL_STORY_ID"

          # Pull request execution
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then

            # First try the PR title.
            if [[ -n "$PR_TITLE" ]]; then
              USER_STORY_ID=$(
                echo "$PR_TITLE" |
                grep -oE '[A-Z][A-Z0-9]+-[0-9]+' |
                head -1 || true
              )
            fi

            # If not found, try the PR branch.
            if [[ -z "$USER_STORY_ID" && -n "$PR_BRANCH" ]]; then
              USER_STORY_ID=$(
                echo "$PR_BRANCH" |
                grep -oE '[A-Z][A-Z0-9]+-[0-9]+' |
                head -1 || true
              )
            fi
          fi

          if [[ -z "$USER_STORY_ID" ]]; then
            echo "ERROR: Could not determine User Story ID."
            echo ""
            echo "For automatic PR runs, the PR title or branch"
            echo "must contain a Jira-style User Story ID."
            echo ""
            echo "Example PR title:"
            echo "CJS-2: Implement Simple Login Page"
            echo ""
            echo "Example branch:"
            echo "feature/CJS-2-login"
            exit 1
          fi

          echo "==========================================="
          echo "User Story ID: $USER_STORY_ID"
          echo "==========================================="

          echo "user_story_id=$USER_STORY_ID" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 4. Validate artifacts
      # --------------------------------------------------
      - name: Validate artifacts exist
        shell: bash
        env:
          USER_STORY_ID: ${{ steps.story.outputs.user_story_id }}
        run: |
          set -e

          ARTIFACT_DIR="docs/artifacts/$USER_STORY_ID"

          echo "Checking artifact directory:"
          echo "$ARTIFACT_DIR"

          if [[ ! -d "$ARTIFACT_DIR" ]]; then
            echo "ERROR: Artifact directory not found:"
            echo "$ARTIFACT_DIR"
            echo ""
            echo "Available artifact directories:"

            if [[ -d "docs/artifacts" ]]; then
              find docs/artifacts \
                -maxdepth 1 \
                -mindepth 1 \
                -type d \
                -print || true
            else
              echo "docs/artifacts directory does not exist."
            fi

            exit 1
          fi

          echo "Artifact directory found."

          echo ""
          echo "Artifacts:"
          ls -la "$ARTIFACT_DIR"

      # --------------------------------------------------
      # 5. Publish to Confluence
      # --------------------------------------------------
      - name: Publish to Confluence
        shell: bash
        env:
          USER_STORY_ID: ${{ steps.story.outputs.user_story_id }}
          CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_SPACE_KEY: claudecaps
        run: |
          set -e

          echo "==========================================="
          echo "Publishing to Confluence"
          echo "==========================================="
          echo "User Story: $USER_STORY_ID"
          echo "Space Key: $CONFLUENCE_SPACE_KEY"
          echo "==========================================="

          node tools/confluence/publisher.mjs

      # --------------------------------------------------
      # 6. Commit publication status
      # --------------------------------------------------
      - name: Commit publication status
        if: success()
        shell: bash
        env:
          USER_STORY_ID: ${{ steps.story.outputs.user_story_id }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e

          STATUS_FILE="docs/artifacts/$USER_STORY_ID/confluence-status.json"

          if [[ ! -f "$STATUS_FILE" ]]; then
            echo "WARNING: Confluence status file was not created."
            exit 0
          fi

          echo "Publication status:"
          cat "$STATUS_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$STATUS_FILE"

          if git diff --cached --quiet; then
            echo "No publication status changes to commit."
            exit 0
          fi

          git commit \
            -m "docs: add Confluence publication status for $USER_STORY_ID"

          # Pull request workflows run in detached HEAD mode.
          # Push the generated commit explicitly to the PR source branch.
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BRANCH" ]]; then
            echo "Pushing publication status to PR branch: $PR_BRANCH"
            git push origin "HEAD:$PR_BRANCH"
          else
            echo "Pushing publication status..."
            git push
          fi

      # --------------------------------------------------
      # 7. Workflow Summary
      # --------------------------------------------------
      - name: Summary
        if: always()
        shell: bash
        env:
          USER_STORY_ID: ${{ steps.story.outputs.user_story_id }}
        run: |
          STATUS_FILE="docs/artifacts/$USER_STORY_ID/confluence-status.json"

          echo "## Confluence Publication Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**User Story ID:** ${USER_STORY_ID:-Unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ -f "$STATUS_FILE" ]]; then
            URL=$(jq -r '.url // empty' "$STATUS_FILE")
            TIMESTAMP=$(jq -r '.timestamp // empty' "$STATUS_FILE")
            PAGE_ID=$(jq -r '.pageId // empty' "$STATUS_FILE")

            echo "**Status:** ✅ Published" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Page ID:** $PAGE_ID" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**URL:** $URL" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Timestamp:** $TIMESTAMP" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Status:** ❌ Publication failed or status file unavailable" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
