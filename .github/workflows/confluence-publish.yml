name: Publish to Confluence

on:
  workflow_dispatch:
    inputs:
      user_story_id:
        description: 'User Story ID (e.g., CJS-2)'
        required: true
        type: string

  pull_request:
    types: [closed]
    branches: [main]

jobs:
  publish:
    name: Publish SDLC Artifacts to Confluence
    runs-on: ubuntu-latest

    # Run manually, or automatically when a PR is actually merged into main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true
      )

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # --------------------------------------------------
      # 3. Extract User Story ID
      # --------------------------------------------------
            - name: Extract User Story ID
        id: extract_id
        shell: bash
        run: |
          set -e

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            USER_STORY_ID="${{ github.event.inputs.user_story_id }}"

          else

            echo "Detecting User Story ID from artifact directories..."

            ARTIFACT_ROOT="docs/artifacts"

            # Find directories directly under docs/artifacts.
            # Example:
            # docs/artifacts/CJS-2
            #            └── CJS-2 = User Story ID
            #
            # Ignore files and hidden directories.
            USER_STORY_ID=$(
              find "$ARTIFACT_ROOT" \
                -mindepth 1 \
                -maxdepth 1 \
                -type d \
                -printf '%f\n' |
              grep -E '^[A-Z][A-Z0-9]+-[0-9]+$' |
              head -1 ||
              true
            )

          fi

          if [[ -z "$USER_STORY_ID" ]]; then
            echo "ERROR: Could not determine User Story ID."
            echo ""
            echo "Expected an artifact directory such as:"
            echo "  docs/artifacts/CJS-2/"
            echo "  docs/artifacts/CJS-10/"
            echo "  docs/artifacts/ABC-123/"
            echo ""
            echo "Available artifact directories:"
            find docs/artifacts \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '  %f\n' ||
              true

            exit 1
          fi

          echo "==========================================="
          echo "Detected User Story ID: $USER_STORY_ID"
          echo "==========================================="

          echo "user_story_id=$USER_STORY_ID" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 4. Validate artifacts exist
      # --------------------------------------------------
      - name: Validate artifacts exist
        shell: bash
        run: |
          set -e

          USER_STORY_ID="${{ steps.extract_id.outputs.user_story_id }}"
          ARTIFACT_DIR="docs/artifacts/$USER_STORY_ID"

          echo "==========================================="
          echo "Validating artifacts"
          echo "==========================================="
          echo "User Story: $USER_STORY_ID"
          echo "Artifact Directory: $ARTIFACT_DIR"
          echo "==========================================="

          if [[ ! -d "$ARTIFACT_DIR" ]]; then
            echo "ERROR: Artifact directory not found:"
            echo "$ARTIFACT_DIR"
            exit 1
          fi

          echo "Artifact directory found."
          echo ""
          echo "Artifacts:"
          ls -la "$ARTIFACT_DIR"

      # --------------------------------------------------
      # 5. Publish to Confluence
      # --------------------------------------------------
      - name: Publish to Confluence
        shell: bash
        run: |
          set -e

          echo "==========================================="
          echo "Publishing to Confluence"
          echo "==========================================="
          echo "User Story: $USER_STORY_ID"
          echo "Space Key: $CONFLUENCE_SPACE_KEY"
          echo "==========================================="

          node tools/confluence/publisher.mjs
        env:
          USER_STORY_ID: ${{ steps.extract_id.outputs.user_story_id }}

          CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}

          # Confluence space key is not a secret.
          CONFLUENCE_SPACE_KEY: claudecaps

      # --------------------------------------------------
      # 6. Commit publication status
      # --------------------------------------------------
      - name: Commit confluence-status.json
        shell: bash
        run: |
          set -e

          USER_STORY_ID="${{ steps.extract_id.outputs.user_story_id }}"
          STATUS_FILE="docs/artifacts/$USER_STORY_ID/confluence-status.json"

          if [[ -f "$STATUS_FILE" ]]; then

            echo "==========================================="
            echo "Confluence publication status"
            echo "==========================================="

            cat "$STATUS_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "$STATUS_FILE"

            git commit \
              -m "docs: add Confluence publication status for $USER_STORY_ID" \
              || echo "No changes to commit"

            git push || echo "Nothing to push"

          else

            echo "WARNING: Confluence status file was not created."

          fi

      # --------------------------------------------------
      # 7. Workflow Summary
      # --------------------------------------------------
      - name: Summary
        shell: bash
        run: |
          USER_STORY_ID="${{ steps.extract_id.outputs.user_story_id }}"
          STATUS_FILE="docs/artifacts/$USER_STORY_ID/confluence-status.json"

          echo "## Confluence Publication Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**User Story:** $USER_STORY_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ -f "$STATUS_FILE" ]]; then

            URL=$(jq -r '.url // empty' "$STATUS_FILE")
            TIMESTAMP=$(jq -r '.timestamp // empty' "$STATUS_FILE")
            PAGE_ID=$(jq -r '.pageId // empty' "$STATUS_FILE")

            echo "**Status:** ✅ Published" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            if [[ -n "$PAGE_ID" ]]; then
              echo "**Page ID:** $PAGE_ID" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi

            if [[ -n "$URL" ]]; then
              echo "**URL:** $URL" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi

            if [[ -n "$TIMESTAMP" ]]; then
              echo "**Timestamp:** $TIMESTAMP" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi

          else

            echo "**Status:** ❌ Publication failed" >> "$GITHUB_STEP_SUMMARY"

          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"